<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laporan Spam WhatsApp</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #25d366;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin: 0 0 30px;
            color: #111;
        }

        label {
            display: block;
            font-size: 16px;
            margin-bottom: 9px;
            color: #444;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 52px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #25d366;
            box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.15);
        }

        button {
            width: 100%;
            height: 52px;
            margin-top: 18px;
            border: none;
            border-radius: 10px;
            background: #25d366;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1ebe5d;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="icon">📋</div>

    <h1>Laporan Spam</h1>

    <form action="/kirim" method="POST">

        <label for="nomor">
            Nomor WhatsApp
        </label>

        <input
            type="text"
            id="nomor"
            name="nomor"
            placeholder="+6281234567890"
            required
        >

        <button type="submit">
            Kirim Laporan
        </button>

    </form>

</div>

</body>
</html>
