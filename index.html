<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WhatsApp Report</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #25d366;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        h1 {
            margin: 0;
            color: #111827;
            font-size: 25px;
        }

        .subtitle {
            margin-top: 8px;
            color: #6b7280;
            font-size: 14px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            color: #374151;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 13px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #25d366;
            box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.15);
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        .info {
            margin-top: 18px;
            padding: 12px;
            background: #f0fdf4;
            border-radius: 10px;
            color: #166534;
            font-size: 13px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #25d366;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1ebe5d;
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            color: #9ca3af;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="header">
        <div class="icon">📋</div>

        <h1>WhatsApp Report</h1>

        <div class="subtitle">
            Formulir laporan akun WhatsApp
        </div>
    </div>

    <form action="/kirim" method="POST">

        <label for="nomor">
            Nomor WhatsApp
        </label>

        <input
            type="text"
            id="nomor"
            name="nomor"
            placeholder="Contoh: 628123456789"
            required
        >

        <label for="subjek">
            Subjek Laporan
        </label>

        <input
            type="text"
            id="subjek"
            name="subjek"
            placeholder="Contoh: Laporan Dugaan Penipuan"
            required
        >

        <label for="isi">
            Isi Laporan
        </label>

        <textarea
            id="isi"
            name="isi"
            placeholder="Tulis kronologi atau alasan laporan di sini..."
            required
        ></textarea>

        <div class="info">
            ℹ️ Nomor yang kamu masukkan akan otomatis dicantumkan ke dalam email.
        </div>

        <button type="submit">
            📨 Kirim Laporan
        </button>

    </form>

    <div class="footer">
        1 klik = 1 pengiriman
    </div>

</div>

<script>
    const nomor = document.getElementById("nomor");
    const isi = document.getElementById("isi");

    let templateAktif = true;

    nomor.addEventListener("input", function () {
        if (templateAktif && nomor.value.trim() !== "") {
            isi.value =
                "Nomor WhatsApp yang dilaporkan: " +
                nomor.value +
                "\n\n" +
                "Kronologi / Isi Laporan:\n";
        }
    });

    isi.addEventListener("input", function () {
        templateAktif = false;
    });
</script>

</body>
</html>
